name: "CleverTree"
version: "1.0.0"
description: "Ari Asulin portfolio — CleverScript on Relay"
# Prefer a single public origin for crawlers and share cards.
canonical: "https://clevertree.net/"
client:
  hooks:
    get:
      path: hooks/client/get.jsx
server:
  hooks:
    get:
      path: hooks/server/get.cs
  # Opt-in shared HTTP-01 + cert fan-out for catalog domains[] (multi-node park).
  tls:
    plugin: park
git:
  autoPush:
    branches: ["main", "release"]
    originList:
      - "dfw1.relaygateway.net"
      - "lon1.relaygateway.net"
      - "hkg1.relaygateway.net"
    debounceSeconds: 2
  branchRules:
    default:
      requireSigned: false
      allowedKeys: [".ssh/*"]
    branches:
      - name: main
        rule:
          requireSigned: false
      - name: release
        rule:
          allowUnsigned: true
