themes:
  light:
    variables:
      bg: "#eef6ea"
      foreground: "#041619"
      card: "#f7fcf4"
      muted: "#3d5c52"
      primary: "#6a9a12"
      primaryFg: "#041619"
      secondary: "#d7e8cf"
      secondaryFg: "#041619"
      border: "#b7cfc0"
      badgeActive: "#b7ff00"
      badgePublished: "#ff8f00"
      badgePlanned: "#e91e63"
      badgeInactive: "#7a9088"
      heroGlow: "#b7ff00"
      heroSun: "#ff8f00"
    breakpoints:
      sm: "640px"
      md: "768px"
      lg: "1024px"
    selectors:
      body:
        backgroundColor: "var(bg)"
        color: "var(foreground)"
        fontFamily: "Avenir Next, Gill Sans, Trebuchet MS, Segoe UI, sans-serif"
        lineHeight: "1.5"
        margin: 0
      ".ct-page":
        backgroundColor: "var(bg)"
        color: "var(foreground)"
        minHeight: "100vh"
      ".ct-page-home":
        backgroundColor: "#041619"
        backgroundImage: "url(/logo/bg-portrait.jpg)"
        backgroundSize: "cover"
        backgroundPosition: "center top"
        backgroundRepeat: "no-repeat"
        backgroundAttachment: "scroll"
        color: "#f2fff6"
      ".ct-page-home-landscape":
        backgroundImage: "url(/logo/bg-landscape.jpg)"
        backgroundPosition: "center center"
      ".ct-hero":
        position: "relative"
        width: "100%"
        minHeight: "100vh"
        boxSizing: "border-box"
        padding: "1.25rem 1rem 3rem"
        display: "flex"
        flexDirection: "column"
        justifyContent: "flex-start"
      ".ct-hero-bar":
        display: "flex"
        justifyContent: "flex-end"
        alignItems: "center"
        gap: "0.75rem"
        marginBottom: "1.5rem"
        maxWidth: "72rem"
        width: "100%"
        marginLeft: "auto"
        marginRight: "auto"
      ".ct-hero-inner":
        display: "flex"
        flexDirection: "column"
        alignItems: "center"
        gap: "1.75rem"
        width: "100%"
        maxWidth: "100%"
        marginLeft: "auto"
        marginRight: "auto"
        flexGrow: "1"
        justifyContent: "center"
        boxSizing: "border-box"
        paddingLeft: "4vw"
        paddingRight: "4vw"
      ".ct-hero-inner-row":
        flexDirection: "row"
        alignItems: "flex-end"
        justifyContent: "space-between"
        gap: "3vw"
        paddingBottom: "10vh"
        paddingLeft: "6vw"
        paddingRight: "7vw"
      ".ct-hero-tree":
        display: "flex"
        justifyContent: "center"
        width: "100%"
        order: "0"
      ".ct-hero-tree-side":
        width: "42%"
        maxWidth: "420px"
        flex: "0 1 42%"
        justifyContent: "flex-start"
        order: "0"
        paddingBottom: "2vh"
      ".ct-hero-copy":
        display: "flex"
        flexDirection: "column"
        alignItems: "center"
        textAlign: "center"
        gap: "0.85rem"
        width: "100%"
        maxWidth: "36rem"
      ".ct-hero-copy-side":
        alignItems: "flex-start"
        textAlign: "left"
        width: "48%"
        maxWidth: "36rem"
        flex: "0 1 48%"
        paddingBottom: "4vh"
        marginLeft: "auto"
      ".ct-container":
        maxWidth: "64rem"
        marginLeft: "auto"
        marginRight: "auto"
        padding: "3rem 1rem 4rem"
        width: "100%"
        boxSizing: "border-box"
      ".ct-header":
        marginBottom: "5rem"
      ".ct-header-top":
        display: "flex"
        flexDirection: "column"
        flexWrap: "wrap"
        alignItems: "center"
        justifyContent: "space-between"
        gap: "1.5rem"
        marginBottom: "1.5rem"
      ".ct-header-top-row":
        flexDirection: "row"
        alignItems: "flex-end"
      ".ct-identity":
        display: "flex"
        flexDirection: "row"
        alignItems: "center"
        justifyContent: "center"
        gap: "1.5rem"
        textAlign: "center"
      ".ct-brand-mark":
        display: "block"
        width: "96px"
        height: "96px"
        objectFit: "contain"
        flexShrink: "0"
        borderRadius: "0.5rem"
      ".ct-identity-text":
        display: "flex"
        flexDirection: "column"
        gap: "0.5rem"
        textAlign: "center"
      ".ct-identity-text-left":
        textAlign: "left"
      ".ct-name":
        fontFamily: "Iowan Old Style, Palatino Linotype, Palatino, Georgia, serif"
        fontSize: "clamp(2.75rem, 7vw, 4.25rem)"
        fontWeight: "800"
        letterSpacing: "-0.03em"
        margin: 0
        lineHeight: "1"
        color: "#f7fff4"
        textShadow: "0 2px 24px rgba(4, 22, 25, 0.55)"
      ".ct-title":
        fontSize: "clamp(1.15rem, 3vw, 1.45rem)"
        fontWeight: "500"
        margin: 0
        color: "#c9f07a"
        letterSpacing: "0.04em"
        textTransform: "uppercase"
      ".ct-actions":
        display: "flex"
        flexWrap: "wrap"
        alignItems: "center"
        justifyContent: "center"
        gap: "0.75rem"
      ".ct-print-actions":
        display: "flex"
        flexWrap: "wrap"
        alignItems: "center"
        gap: "0.5rem"
      ".ct-icon-btn":
        display: "inline-flex"
        alignItems: "center"
        justifyContent: "center"
        width: "2.625rem"
        height: "2.625rem"
        padding: 0
        boxSizing: "border-box"
        borderRadius: "9999px"
        borderWidth: 1
        borderStyle: "solid"
        borderColor: "var(border)"
        backgroundColor: "var(secondary)"
        color: "var(secondaryFg)"
        cursor: "pointer"
      ".ct-icon-btn-placeholder":
        width: "2.5rem"
        height: "2.5rem"
        borderRadius: "9999px"
        backgroundColor: "var(secondary)"
      ".ct-action-btn":
        display: "inline-flex"
        alignItems: "center"
        gap: "0.5rem"
        padding: "0.625rem 1rem"
        boxSizing: "border-box"
        borderRadius: "9999px"
        fontSize: "0.875rem"
        fontWeight: "600"
        fontFamily: "inherit"
        lineHeight: "1.25rem"
        borderWidth: 1
        borderStyle: "solid"
        borderColor: "var(border)"
        textDecoration: "none"
        backgroundColor: "var(secondary)"
        color: "var(secondaryFg)"
        cursor: "pointer"
        boxShadow: "0 1px 2px rgba(15, 23, 42, 0.08)"
      ".ct-bio":
        fontSize: "1.125rem"
        lineHeight: "1.625"
        margin: "0 auto"
        textAlign: "center"
      ".ct-bio-left":
        textAlign: "left"
        marginLeft: 0
        marginRight: 0
      ".ct-contacts":
        display: "flex"
        flexWrap: "wrap"
        justifyContent: "center"
        gap: "1rem"
        marginTop: "1.5rem"
      ".ct-contacts-left":
        justifyContent: "flex-start"
      ".ct-chip":
        display: "inline-flex"
        alignItems: "center"
        gap: "0.5rem"
        padding: "0.375rem 0.75rem"
        boxSizing: "border-box"
        borderRadius: "9999px"
        fontSize: "0.875rem"
        fontWeight: "500"
        lineHeight: "1.25rem"
        borderWidth: 1
        borderStyle: "solid"
        borderColor: "var(border)"
        textDecoration: "none"
        backgroundColor: "var(secondary)"
        color: "var(secondaryFg)"
      ".ct-muted":
        color: "var(muted)"
      ".ct-card":
        backgroundColor: "var(card)"
        color: "var(foreground)"
        borderColor: "var(border)"
        borderWidth: 1
        borderStyle: "solid"
        borderRadius: "0.5rem"
        padding: "1.5rem"
        boxShadow: "0 1px 2px rgba(15, 23, 42, 0.06)"
        display: "flex"
        flexDirection: "column"
        boxSizing: "border-box"
      ".ct-project-card":
        height: "100%"
      ".ct-card-head":
        display: "flex"
        justifyContent: "space-between"
        alignItems: "flex-start"
        gap: "0.75rem"
        marginBottom: "0.5rem"
      ".ct-card-title":
        fontSize: "1.25rem"
        fontWeight: "700"
        lineHeight: "1.75rem"
        margin: 0
      ".ct-card-links":
        display: "flex"
        flexWrap: "wrap"
        gap: "1rem"
        marginTop: "auto"
      ".ct-primary":
        backgroundColor: "var(primary)"
        color: "var(primaryFg)"
        borderColor: "var(primary)"
        borderWidth: 0
        boxShadow: "0 4px 18px rgba(183, 255, 0, 0.28)"
      ".ct-secondary":
        backgroundColor: "var(secondary)"
        color: "var(secondaryFg)"
      ".ct-border":
        borderColor: "var(border)"
      ".ct-link":
        color: "var(foreground)"
        textDecoration: "none"
        fontSize: "0.875rem"
        lineHeight: "1.25rem"
      ".ct-link-row":
        display: "inline-flex"
        alignItems: "center"
        gap: "0.25rem"
      ".ct-lib-card":
        padding: "1rem"
        gap: "0.5rem"
        minHeight: "8.375rem"
      ".ct-lib-name":
        display: "flex"
        alignItems: "center"
        gap: "0.75rem"
      ".ct-lib-icon":
        color: "var(primary)"
        display: "inline-flex"
      ".ct-lib-mono":
        fontFamily: "ui-monospace, SFMono-Regular, Menlo, monospace"
        fontWeight: "700"
        fontSize: "1.125rem"
      ".ct-icon-link":
        display: "inline-flex"
        alignItems: "center"
        justifyContent: "center"
        padding: "0.5rem"
        borderRadius: "9999px"
        color: "var(foreground)"
        textDecoration: "none"
      ".ct-badge":
        fontSize: "0.75rem"
        fontWeight: "600"
        borderRadius: "9999px"
        padding: "0.15rem 0.6rem"
        textTransform: "lowercase"
        whiteSpace: "nowrap"
      ".ct-badge-active":
        backgroundColor: "var(badgeActive)"
        color: "#052e16"
      ".ct-badge-published":
        backgroundColor: "var(badgePublished)"
        color: "#eff6ff"
      ".ct-badge-planned":
        backgroundColor: "var(badgePlanned)"
        color: "#422006"
      ".ct-badge-inactive":
        backgroundColor: "var(badgeInactive)"
        color: "#0f172a"
      ".ct-tree-figure":
        margin: "0 0 2.5rem 0"
        display: "flex"
        flexDirection: "column"
        alignItems: "center"
        gap: "0.5rem"
        width: "100%"
      ".ct-tree-canvas":
        display: "block"
        height: "220px"
        width: "min(100%, 400px)"
        minWidth: "280px"
        maxWidth: "100%"
        cursor: "pointer"
        borderRadius: "0.5rem"
      ".ct-tree-logo":
        height: "120px"
        width: "120px"
        minWidth: "96px"
        maxWidth: "120px"
        flexShrink: "0"
      ".ct-tree-hero":
        height: "280px"
        width: "min(100%, 340px)"
        minWidth: "240px"
        maxWidth: "340px"
        flexShrink: "0"
        cursor: "pointer"
        borderRadius: "0"
        backgroundColor: "transparent"
      "ct-tree-grow.ct-tree-canvas":
        display: "block"
        height: "220px"
        width: "min(100%, 400px)"
        minWidth: "280px"
        maxWidth: "100%"
        cursor: "pointer"
        borderRadius: "0.5rem"
      "ct-tree-grow":
        display: "block"
        width: "min(100%, 400px)"
        minWidth: "280px"
        height: "220px"
      "ct-tree-grow.ct-tree-logo":
        height: "120px"
        width: "120px"
        minWidth: "96px"
        maxWidth: "120px"
      "ct-tree-grow.ct-tree-hero":
        height: "280px"
        width: "min(100%, 340px)"
        minWidth: "240px"
        maxWidth: "340px"
        backgroundColor: "transparent"
      "ct-tree-grow canvas":
        display: "block"
        width: "100%"
        height: "220px"
      "ct-tree-grow.ct-tree-logo canvas":
        height: "120px"
      "ct-tree-grow.ct-tree-hero canvas":
        height: "280px"
        backgroundColor: "transparent"
      ".ct-tree-caption":
        fontSize: "0.875rem"
        margin: 0
        textAlign: "center"
      ".ct-embed-stack":
        display: "flex"
        flexDirection: "column"
        gap: "2rem"
        marginBottom: "1rem"
      ".ct-embed-panel":
        display: "flex"
        flexDirection: "column"
        gap: "0.75rem"
        width: "100%"
      ".ct-embed-label":
        fontSize: "1.125rem"
        fontWeight: "700"
        margin: 0
      ".ct-chat-embed":
        minHeight: "28rem"
        width: "100%"
        borderWidth: 1
        borderStyle: "solid"
        borderColor: "var(border)"
        borderRadius: "0.5rem"
        overflow: "hidden"
        backgroundColor: "var(card)"
      ".ct-songwalker-embed":
        display: "flex"
        flexDirection: "column"
        gap: "0.5rem"
        width: "100%"
        minHeight: "28rem"
      # Frame chrome is applied inline by SongWalkerEmbed.host.js — themed-styler
      # drops .ct-songwalker-frame because the iframe is not present in SSR HTML.
      ".ct-embed-footnote":
        fontSize: "0.875rem"
        margin: 0
      ".ct-chat-embed-fallback":
        fontSize: "0.875rem"
        padding: "0 0.75rem 0.75rem"
      ".ct-section":
        marginBottom: "3rem"
      ".ct-section-title":
        fontSize: "1.875rem"
        fontWeight: "700"
        lineHeight: "2.25rem"
        marginBottom: "1.5rem"
        paddingBottom: "0.5rem"
        borderBottomWidth: 1
        borderBottomStyle: "solid"
        borderBottomColor: "var(border)"
      ".ct-projects":
        display: "grid"
        gridTemplateColumns: "1fr"
        gap: "1.5rem"
      ".ct-projects-md":
        gridTemplateColumns: "1fr 1fr"
      ".ct-libraries":
        display: "grid"
        gridTemplateColumns: "1fr"
        gap: "1rem"
      ".ct-libraries-md":
        gridTemplateColumns: "1fr 1fr"
      ".ct-lib-row":
        display: "flex"
        alignItems: "center"
        justifyContent: "space-between"
        gap: "0.75rem"
      ".ct-lib-links":
        display: "flex"
        gap: "0.5rem"
      ".ct-resume-grid":
        display: "grid"
        gridTemplateColumns: "1fr"
        gap: "2rem"
        fontSize: "0.875rem"
      ".ct-resume-md":
        gridTemplateColumns: "2fr 1fr"
      ".ct-thankyou-hero":
        minHeight: "100vh"
      ".ct-thankyou-actions":
        display: "flex"
        flexWrap: "wrap"
        alignItems: "center"
        justifyContent: "center"
        gap: "0.75rem"
        marginTop: "0.5rem"
      ".ct-thankyou-note":
        fontSize: "0.95rem"
        lineHeight: "1.5"
        margin: "0.75rem auto 0"
        textAlign: "center"
        maxWidth: "32rem"
      ".ct-thankyou-mail":
        color: "#c9f07a"
        textDecoration: "underline"
      ".ct-footer":
        marginTop: "5rem"
        paddingTop: "2rem"
        borderTopWidth: 1
        borderTopStyle: "solid"
        borderTopColor: "var(border)"
        textAlign: "center"
        fontSize: "0.875rem"
      "h1, h2, h3, h4, p, span, a, button, li, blockquote":
        color: "inherit"
  dark:
    inherits: light
    variables:
      bg: "#041619"
      foreground: "#f2fff6"
      card: "#0a2428"
      muted: "#9ec4b4"
      primary: "#b7ff00"
      primaryFg: "#041619"
      secondary: "#0f3338"
      secondaryFg: "#f2fff6"
      border: "#2a4a40"
      badgeActive: "#b7ff00"
      badgePublished: "#ff8f00"
      badgePlanned: "#e91e63"
      badgeInactive: "#5f7a72"
      heroGlow: "#b7ff00"
      heroSun: "#ff8f00"
current_theme: dark
